name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DART_COMMAND: dart
  FLUTTER_COMMAND: flutter

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update -y &&
          sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt

      - name: Cache Rust dependencies and tools
        uses: Swatinem/rust-cache@v2
        with:
          key: check
          workspaces: rust -> target

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Install flutter_rust_bridge code generator
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0-beta.5 --locked

      - name: Resolve package dependencies
        run: flutter pub get

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Run checks
        run: xvfb-run -a just check

      - name: Verify generated files are current
        run: git diff --exit-code

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-24.04
          - target: ios
            os: macos-15
          - target: linux
            os: ubuntu-24.04
          - target: macos
            os: macos-15
          - target: web
            os: ubuntu-24.04
          - target: windows
            os: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: >-
          sudo apt-get update -y &&
          sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Set up Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt

      - name: Cache Rust dependencies and tools
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: rust -> target

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Install flutter_rust_bridge code generator
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0-beta.5 --locked

      - name: Set up Rust WASM toolchain
        if: matrix.target == 'web'
        run: rustup toolchain install nightly --component rust-src --target wasm32-unknown-unknown

      - name: Resolve package dependencies
        run: flutter pub get

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build ${{ matrix.target }}
        run: just build ${{ matrix.target }}
